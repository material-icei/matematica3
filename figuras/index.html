<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploradores de Figuras</title>
  <meta name="description" content="Aventura de geometría para 3.º grado: figuras, guardas, propiedades, composición de figuras, lados, vértices y diagonales.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,8 94,88 6,88' fill='%23FF9F1C'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#app">Ir al contenido</a>

  <header class="topbar" role="banner">
    <button class="brand" id="brandBtn" type="button" aria-label="Ir a la pantalla inicial">
      <svg viewBox="0 0 64 64" class="brand-logo" aria-hidden="true">
        <polygon points="32,6 58,52 6,52" fill="#FF9F1C" stroke="#C26A00" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="45" cy="44" r="12" fill="#3B9EF2" stroke="#1D6FB8" stroke-width="3"/>
        <rect x="8" y="34" width="20" height="20" rx="2" fill="#43B864" stroke="#2A8445" stroke-width="3"/>
      </svg>
      <span>Exploradores de Figuras</span>
    </button>

    <div class="stats" aria-label="Mis logros">
      <span class="chip chip-star" title="Estrellas"><span aria-hidden="true">⭐</span> <b id="statStars">0</b><span class="sr"> estrellas</span></span>
      <span class="chip chip-xp" title="Puntos de experiencia"><span aria-hidden="true">⚡</span> <b id="statXp">0</b><span class="sr"> puntos de experiencia</span></span>
      <span class="chip chip-streak" title="Racha de desafíos seguidos"><span aria-hidden="true">🔥</span> <b id="statStreak">0</b><span class="sr"> desafíos seguidos</span></span>
      <span class="chip chip-badge" title="Insignias"><span aria-hidden="true">🏅</span> <b id="statBadges">0</b><span class="sr"> insignias</span></span>
    </div>

    <nav class="topnav" aria-label="Navegación">
      <button class="btn btn-small btn-light" id="navMap" type="button"><span aria-hidden="true">🗺️</span> Mapa</button>
      <button class="btn btn-small btn-light" id="navReport" type="button"><span aria-hidden="true">📋</span> Mi informe</button>
      <button class="btn btn-small btn-light" id="navReset" type="button"><span aria-hidden="true">↺</span> Reiniciar</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>

  <noscript>
    <p class="noscript">Para jugar a Exploradores de Figuras necesitás activar JavaScript en el navegador.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
